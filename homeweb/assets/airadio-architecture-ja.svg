<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc">
<title id="title">Lingxi AIRadio システム構成</title>
<desc id="desc">実機 AIRadio ESP32 は Lingxi 音声チャンネルへ直接接続して音声と MCP を処理し、独立した Intercom Service が同じルームの機器と Opus 音声を交換します。サーバーは ASR、TTS、Hosting LLM を非同期で実行します。</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1814"/><stop offset="1" stop-color="#183126"/></linearGradient>
 <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#d3ffb8"/><stop offset="1" stop-color="#83d986"/></linearGradient>
 <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#e0c8ff"/><stop offset="1" stop-color="#ad8cec"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".24"/></filter>
 <marker id="arrowMint" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b9f6a5"/></marker>
 <marker id="arrowMintStart" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M10 0 0 5 10 10Z" fill="#b9f6a5"/></marker>
 <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#d0b2fb"/></marker>
 <marker id="arrowVioletStart" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M10 0 0 5 10 10Z" fill="#d0b2fb"/></marker>
 <style>
  .sans{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif}.eyebrow{font-size:12px;letter-spacing:3px;fill:#c2f6a4}.title{font-size:29px;font-weight:700;fill:#f4f8ed}.label{font-size:12px;letter-spacing:1.5px;fill:#9bb39b}.name{font-size:22px;font-weight:700;fill:#fff}.copy{font-size:13px;fill:#b7cdb7}.small{font-size:12px;fill:#91aa91}.tag{font-size:12px;font-weight:600}.lineLabel{font-size:12px;fill:#c9f4b6}.lineLabelV{font-size:12px;fill:#dfc9ff}.foot{font-size:12px;fill:#728b78}
 </style>
</defs>
<rect width="1400" height="960" rx="28" fill="url(#bg)"/>
<g class="sans"><text x="58" y="55" class="eyebrow">AIRADIO / REAL DEVICE ARCHITECTURE</text><text x="58" y="91" class="title">実機で現場の声をつなぐ</text><text x="58" y="119" class="small">2 つの独立経路：Lingxi/XiaoZhi は音声と MCP、Intercom Service はリアルタイム音声とルーム連携を担当</text>
<!-- top voice platform -->
<rect x="335" y="150" width="730" height="105" rx="18" fill="#272039" stroke="#d0b2fb" stroke-opacity=".75" stroke-width="2" filter="url(#shadow)"/>
<text x="365" y="182" class="label" fill="#dbc5ff">VOICE &amp; MCP PLATFORM</text><text x="365" y="218" class="name">Lingxi/XiaoZhi 音声チャンネル</text><text x="700" y="183" class="copy">音声認識 · モデル対話 · TTS · MCP ツール</text><text x="700" y="214" class="small">2 つのプラットフォーム、共通プロトコル</text>
<g transform="translate(0 65)">
<!-- physical device cards -->
<g filter="url(#shadow)"><rect x="20" y="305" width="330" height="226" rx="18" fill="#1e3a2a" stroke="#b9f6a5" stroke-opacity=".58" stroke-width="2"/><rect x="1050" y="305" width="330" height="226" rx="18" fill="#1e3a2a" stroke="#b9f6a5" stroke-opacity=".58" stroke-width="2"/></g>
<g class="sans"><text x="45" y="340" class="label">REAL DEVICE A</text><text x="45" y="379" class="name">AIRadio 端末 002</text><text x="45" y="414" class="copy">Waveshare ESP32-S3 3.5B</text><text x="45" y="444" class="copy">480×320 タッチ画面 · 大きなボタン</text><text x="45" y="474" class="copy">マイク · スピーカー · ESP32 ファームウェア</text><rect x="45" y="492" width="125" height="23" rx="5" fill="#c2f6a4"/><text x="107" y="508" text-anchor="middle" class="tag" fill="#20351f">実機で稼働</text>
<text x="1070" y="340" class="label">REAL DEVICE B</text><text x="1070" y="379" class="name">AIRadio 端末 004</text><text x="1070" y="414" class="copy">同じルームの別の実機</text><text x="1070" y="444" class="copy">Opus 受信 · 音声再生</text><text x="1070" y="474" class="copy">状態同期 · テキスト記録</text><rect x="1070" y="492" width="125" height="23" rx="5" fill="#c2f6a4"/><text x="1132" y="508" text-anchor="middle" class="tag" fill="#20351f">実機連携テスト</text></g>
<!-- service -->
<rect x="520" y="305" width="360" height="226" rx="18" fill="#10251b" stroke="#b9f6a5" stroke-opacity=".85" stroke-width="2" filter="url(#shadow)"/>
<text x="550" y="340" class="label">CORE SERVICE / GO</text><text x="550" y="379" class="name">Intercom Service</text><text x="550" y="414" class="copy">ルーム・メンバー管理 · WebSocket 音声</text><text x="550" y="444" class="copy">記録 · コンソール · SQLite 永続化</text><text x="550" y="474" class="copy">AI タスク処理 · 有界キュー · 状態確認</text><rect x="550" y="492" width="180" height="23" rx="5" fill="#2c4c36"/><text x="640" y="508" text-anchor="middle" class="tag" fill="#c2f6a4">独立したインターコム経路</text>
</g>
<!-- voice arrows -->
<path d="M185 370V310H500V255" fill="none" stroke="url(#violet)" stroke-width="3" marker-start="url(#arrowVioletStart)" marker-end="url(#arrowViolet)"/><path d="M1215 370V310H900V255" fill="none" stroke="url(#violet)" stroke-width="3" marker-start="url(#arrowVioletStart)" marker-end="url(#arrowViolet)"/>
<text x="342" y="294" text-anchor="middle" class="lineLabelV sans">音声操作 · MCP</text><text x="1058" y="294" text-anchor="middle" class="lineLabelV sans">音声操作 · MCP</text>
<!-- intercom arrows -->
<path d="M350 483H520" fill="none" stroke="#b9f6a5" stroke-width="4" marker-start="url(#arrowMintStart)" marker-end="url(#arrowMint)"/><path d="M1050 483H880" fill="none" stroke="#b9f6a5" stroke-width="4" marker-start="url(#arrowMintStart)" marker-end="url(#arrowMint)"/>
<text x="435" y="459" text-anchor="middle" class="lineLabel sans">WebSocket / Opus</text><text x="965" y="459" text-anchor="middle" class="lineLabel sans">WebSocket / Opus</text>
<!-- additional room participants (ellipsis indicates more terminals) -->
<text x="700" y="348" text-anchor="middle" class="lineLabel sans">同じルームで複数端末が通話</text>
<g fill="none" stroke="#b9f6a5" stroke-width="2" stroke-dasharray="6 6" stroke-opacity=".75" marker-start="url(#arrowMintStart)" marker-end="url(#arrowMint)">
 <path d="M350 666H435V548H520"/>
 <path d="M880 548H965V666H1050"/>
</g>
<g>
 <rect x="20" y="635" width="330" height="62" rx="12" fill="#1e3a2a" stroke="#b9f6a5" stroke-opacity=".58" stroke-width="2" stroke-dasharray="6 6"/>
 <text x="185" y="660" text-anchor="middle" class="copy" style="font-weight:700;fill:#c2f6a4">··· その他の AIRadio 端末</text>
 <text x="185" y="683" text-anchor="middle" class="small">同じルームのメンバー · WebSocket / Opus</text>
 <rect x="1050" y="635" width="330" height="62" rx="12" fill="#1e3a2a" stroke="#b9f6a5" stroke-opacity=".58" stroke-width="2" stroke-dasharray="6 6"/>
 <text x="1215" y="660" text-anchor="middle" class="copy" style="font-weight:700;fill:#c2f6a4">··· その他の AIRadio 端末</text>
 <text x="1215" y="683" text-anchor="middle" class="small">同じルームのメンバー · WebSocket / Opus</text>
</g>
<!-- AI layer -->
<path d="M700 596V750" fill="none" stroke="#b9f6a5" stroke-width="3" marker-end="url(#arrowMint)"/><text x="720" y="675" class="lineLabel sans">非同期処理で音声をブロックしない</text>
<g transform="translate(0 140)">
<rect x="165" y="610" width="1070" height="125" rx="18" fill="#17271f" stroke="#b9f6a5" stroke-opacity=".35" stroke-width="2"/>
<text x="205" y="646" class="label">AI SERVICES / SERVER SIDE</text>
<g><rect x="205" y="665" width="260" height="45" rx="8" fill="#243b2b"/><text x="335" y="693" text-anchor="middle" class="name" font-size="17">ASR · 音声認識</text><rect x="570" y="665" width="260" height="45" rx="8" fill="#243b2b"/><text x="700" y="693" text-anchor="middle" class="name" font-size="17">Hosting LLM · 代理応答判定</text><rect x="935" y="665" width="260" height="45" rx="8" fill="#243b2b"/><text x="1065" y="693" text-anchor="middle" class="name" font-size="17">TTS · 音声再生</text></g>
</g>
<!-- console / simulator -->
<path d="M620 596V714H350V750" fill="none" stroke="#8ba99a" stroke-opacity=".8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowMint)"/><text x="385" y="738" class="small sans">HTTP コンソール / ブラウザシミュレーター（検証用）</text>
<text x="700" y="922" text-anchor="middle" class="foot sans">リアルタイム通話：実機 ESP32 間の低遅延通信 ｜ AI 処理：サーバー側で非同期認識・判定・再生</text></g></svg>
