<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">AIRadio system architecture</title><desc id="desc">AIRadio devices connect directly to the Lingxi XiaoZhi voice channel for voice interaction and MCP operations. Devices connect to the intercom service for room audio and records.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111c18"/><stop offset="1" stop-color="#182c20"/></linearGradient><linearGradient id="mint"><stop stop-color="#c2f6a4"/><stop offset="1" stop-color="#77c77d"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="560" rx="24" fill="url(#bg)"/><g fill="none" stroke="#b8e99b" stroke-opacity=".16" stroke-width="2"><path d="M120 210h230M850 210h230M192 88v77M585 370v100"/></g>
<g font-family="Arial,'Noto Sans SC',sans-serif"><text x="55" y="57" fill="#c2f6a4" font-size="12" letter-spacing="3">AIRADIO / SYSTEM ARCHITECTURE</text><text x="55" y="88" fill="#eef5e9" font-size="26" font-weight="700">让现场语音，连接人与 AI</text>
<g transform="translate(55 165)"><rect width="275" height="175" rx="16" fill="#21392a" stroke="#b8e99b" stroke-opacity=".45"/><text x="24" y="36" fill="#c2f6a4" font-size="12" letter-spacing="2">EDGE DEVICES</text><text x="24" y="77" fill="#fff" font-size="21" font-weight="700">AIRadio 终端</text><text x="24" y="111" fill="#b5c9b3" font-size="13">大按钮即时对讲</text><text x="24" y="138" fill="#b5c9b3" font-size="13">语音操控 · 屏幕状态</text><text x="24" y="165" fill="#b5c9b3" font-size="13">Opus 音频 · MCP 工具</text></g>
<g transform="translate(430 165)"><rect width="310" height="175" rx="16" fill="#102018" stroke="#b8e99b" stroke-opacity=".7"/><text x="25" y="36" fill="#c2f6a4" font-size="12" letter-spacing="2">CORE SERVICE</text><text x="25" y="77" fill="#fff" font-size="21" font-weight="700">Intercom Service</text><text x="25" y="111" fill="#b5c9b3" font-size="13">房间、成员与实时音频路由</text><text x="25" y="138" fill="#b5c9b3" font-size="13">会话记录 · 控制台 · 有界队列</text><text x="25" y="165" fill="#b5c9b3" font-size="13">Go · WebSocket · SQLite</text></g>
<g transform="translate(850 165)"><rect width="295" height="175" rx="16" fill="#21392a" stroke="#b8e99b" stroke-opacity=".45"/><text x="24" y="36" fill="#c2f6a4" font-size="12" letter-spacing="2">AI SERVICES</text><text x="24" y="77" fill="#fff" font-size="21" font-weight="700">ASR · TTS · LLM</text><text x="24" y="111" fill="#b5c9b3" font-size="13">语音转文字与语音播报</text><text x="24" y="138" fill="#b5c9b3" font-size="13">托管判断 · 按需代答</text><text x="24" y="165" fill="#b5c9b3" font-size="13">第三方密钥仅在服务端</text></g>
<g fill="#c2f6a4" font-size="11" text-anchor="middle"><text x="390" y="202">WebSocket / Opus</text><text x="795" y="202">ASR · TTS · Hosting LLM</text><text x="192" y="125">Lingxi / XiaoZhi voice channel</text><text x="585" y="452">HTTP console / simulator</text></g><g stroke="url(#mint)" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M330 252h100"/><path d="M740 252h110"/><path d="M192 165V92"/><path d="M740 330h-155v70"/></g><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#c2f6a4"/></marker></defs><text x="585" y="520" text-anchor="middle" fill="#728b78" font-size="12">终端直接连接灵矽语音通道 · 对讲服务独立路由实时音频 · AI 任务异步处理</text></g></svg>
